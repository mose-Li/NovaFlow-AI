<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000">
<style>
text{font-family:Arial;fill:#333} .t{font-size:30px;font-weight:bold} .l{font-size:18px;font-weight:bold} .s{font-size:14px}
.box{fill:#fff;stroke:#4A6FA5;stroke-width:2;rx:12;ry:12}
line{stroke:#4A6FA5;stroke-width:2;marker-end:url(#a)}
</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4A6FA5"/></marker></defs>
<text x="800" y="40" text-anchor="middle" class="t">Database ER Diagram</text>
<rect class="box" x="200" y="150" width="320" height="220"/><text x="360.0" y="185" text-anchor="middle" class="l">Documents</text>
<rect class="box" x="640" y="150" width="320" height="220"/><text x="800.0" y="185" text-anchor="middle" class="l">Chunks</text>
<rect class="box" x="1080" y="150" width="320" height="220"/><text x="1240.0" y="185" text-anchor="middle" class="l">Embeddings</text>
<line x1="520" y1="260" x2="640" y2="260"/>
<line x1="960" y1="260" x2="1080" y2="260"/>
</svg>